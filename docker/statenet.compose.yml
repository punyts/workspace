# Two Magnetic servers on one database, each a node of the statenet, linked up through a relay to the aggregate that
# writes people's state (docs/design/statenet-network.md, S11), with the roles the hosted database has:
#
#   magnetic-1, magnetic-2 (group "magnetic") ══▶ relay-1 ══▶ aggregate-1 ──▶ Postgres as magnetic_aggregate
#
#   docker compose -f docker/statenet.compose.yml up --build
#
# magnetic-1 is at http://127.0.0.1:4401 and magnetic-2 at http://127.0.0.1:4402. Each server owns the instances it was
# first asked for and reaches the others over the mesh; it connects as magnetic_app, which only reads people's state.
# The servers bind 0.0.0.0, so the development sign-in buttons are off: sign in with a provider (MAGNETIC_LINKEDIN_*).
#
# To check it end to end, make a session and run docker/check.mjs from the workspace with its cookie:
#   docker compose -f docker/statenet.compose.yml exec magnetic-2 node docker/session.mjs tester
#   node docker/check.mjs 'magnetic_session=...'
x-magnetic: &magnetic
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: punyts/magnetic:dev
  environment: &magnetic-env
    MAGNETIC_DATABASE_URL: postgres://magnetic_app:magnetic_app@db:5432/magnetic
    MAGNETIC_SECRET_KEY: ${MAGNETIC_SECRET_KEY:-statenet-compose-secret-change-me}
    MAGNETIC_EMBEDDING: hash
    MAGNETIC_STARTER: none
    MAGNETIC_HOST: 0.0.0.0
    MAGNETIC_MESH_PORT: '4310'
    MAGNETIC_MESH_HOST: 0.0.0.0
    MAGNETIC_GROUP: magnetic
    MAGNETIC_RELAYS: ws://relay-1:4310
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: magnetic
      POSTGRES_PASSWORD: magnetic
      POSTGRES_DB: magnetic
    volumes:
      - ./initdb/extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./initdb-local/roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U magnetic']
      interval: 2s
      retries: 30

  migrate:
    image: punyts/magnetic:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ['migrate', '--app-role', 'magnetic_app', '--aggregate-role', 'magnetic_aggregate']
    environment:
      MAGNETIC_DATABASE_URL: postgres://magnetic:magnetic@db:5432/magnetic
    depends_on:
      db:
        condition: service_healthy

  magnetic-1:
    <<: *magnetic
    environment:
      <<: *magnetic-env
      MAGNETIC_NODE_ID: magnetic-1
      MAGNETIC_MESH_URL: ws://magnetic-1:4310
      MAGNETIC_PUBLIC_ORIGIN: http://127.0.0.1:4401
    ports:
      - '127.0.0.1:4401:4300'

  magnetic-2:
    <<: *magnetic
    environment:
      <<: *magnetic-env
      MAGNETIC_NODE_ID: magnetic-2
      MAGNETIC_MESH_URL: ws://magnetic-2:4310
      MAGNETIC_PUBLIC_ORIGIN: http://127.0.0.1:4402
    ports:
      - '127.0.0.1:4402:4300'

  # Signs the relay's certificate with the statenet's authority, which the servers keep in the database
  relay-certificate:
    image: punyts/magnetic:dev
    command: ['relay-certificate', '--node-id', 'relay-1', '--out', '/certs']
    environment:
      MAGNETIC_DATABASE_URL: postgres://magnetic:magnetic@db:5432/magnetic
      MAGNETIC_SECRET_KEY: ${MAGNETIC_SECRET_KEY:-statenet-compose-secret-change-me}
    volumes:
      - relay-certs:/certs
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The one writer of people's state; restarts until the statenet's authority is in the database
  aggregate-1:
    image: punyts/magnetic:dev
    restart: unless-stopped
    command: ['aggregate']
    environment:
      MAGNETIC_DATABASE_URL: postgres://magnetic_aggregate:magnetic_aggregate@db:5432/magnetic
      MAGNETIC_SECRET_KEY: ${MAGNETIC_SECRET_KEY:-statenet-compose-secret-change-me}
      MAGNETIC_EMBEDDING: hash
      MAGNETIC_NODE_ID: aggregate-1
      MAGNETIC_MESH_PORT: '4310'
      MAGNETIC_MESH_HOST: 0.0.0.0
    depends_on:
      relay-certificate:
        condition: service_completed_successfully

  relay-1:
    image: punyts/magnetic:dev
    restart: unless-stopped
    entrypoint: ['node', 'statenet/dist/relayCli.js']
    environment:
      STATENET_NODE_ID: relay-1
      STATENET_PARENTS: ws://aggregate-1:4310
      STATENET_NODE_KEY_FILE: /certs/relay-1.key.json
      STATENET_NODE_CERTIFICATE_FILE: /certs/relay-1.certificate
      STATENET_AUTHORITY_PUBLIC_KEY_FILE: /certs/relay-1.authority
      STATENET_HOST: 0.0.0.0
    volumes:
      - relay-certs:/certs:ro
    depends_on:
      relay-certificate:
        condition: service_completed_successfully
      aggregate-1:
        condition: service_started

volumes:
  relay-certs:
